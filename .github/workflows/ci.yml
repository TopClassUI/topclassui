name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Omar develops on Windows and this runs on Linux, so a file that slipped
      # through with CRLF would differ here. .gitattributes is what prevents it.
      - name: Line endings are LF
        run: |
          bad=$(git ls-files --eol | grep -E '^i/(crlf|mixed)' | grep -v 'eol=crlf' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "A tracked text file is not LF. Run: git add --renormalize ."
            exit 1
          fi

      - run: pnpm check
